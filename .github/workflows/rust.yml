name: Rust

on:
  workflow_dispatch:
  push:
    branches: ["main", "release"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install HDF5 via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install hdf5:x64-windows

      - name: Set HDF5_DIR and add DLLs to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "HDF5_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # "." not "rust": the real workspace root (and its Cargo.lock) is
          # the repo root (Cargo.toml's [workspace] members = ["rust"]),
          # not the rust/ member directory — pointing this at "rust" hashed
          # a stale, unused duplicate lockfile for the cache key instead of
          # the one Cargo actually resolves against. Target dir is
          # overridden explicitly since .cargo/config.toml redirects it to
          # rust/target (kept there for CI/tools/cross_check.py paths).
          workspaces: ". -> rust/target"

      - name: Run unit and integration tests
        run: cargo test
        working-directory: rust

      # Verification only — not a distribution step. A bare .crate file isn't
      # cargo-installable the way a wheel/tgz is pip/npm-installable (it only
      # means something inside a registry index); this exists purely to
      # catch real packaging-manifest problems early (file inclusion rules,
      # metadata), the same way `cargo publish` itself would, without
      # actually publishing anywhere. The real "how to depend on this" story
      # for Rust is the git-tag dependency already documented in
      # docs/rust.md's Installation section — see VALIDATION_PLAN.md and the
      # conversation this was scoped in for the full reasoning.
      - name: Verify cargo package (packaging + isolated rebuild, not published)
        run: cargo package
        working-directory: rust

      - name: Build release binary
        run: cargo build --release
        working-directory: rust

      # Export the reference fixture to JSON and hash all correction grids.
      # Both outputs are uploaded as artifacts so the compare job can verify
      # that Linux and Windows produce byte-identical results.
      - name: Full workflow example (smoke test)
        run: cargo run --example full_workflow
        working-directory: rust

      - name: Smoke-test CLI and export reference fixture
        shell: bash
        run: |
          bin="target/release/machine-config-cli"
          [[ "$RUNNER_OS" == "Windows" ]] && bin="${bin}.exe"
          "${bin}" export-json ../fixtures/reference_config.h5 > "$RUNNER_TEMP/rust_output.json"
          echo "Exported $(wc -c < "$RUNNER_TEMP/rust_output.json") bytes"
          # Hash each fixture's correction grids for cross-platform parity check
          {
            for f in reference_config reference_config_opcua synthetic_2laser; do
              printf "%s forward: " "$f"
              "${bin}" correction-hash ../fixtures/${f}.h5
              printf "%s inverse: " "$f"
              "${bin}" correction-hash ../fixtures/${f}.h5 --inverse
            done
          } > "$RUNNER_TEMP/correction_hashes.txt"
          cat "$RUNNER_TEMP/correction_hashes.txt"
        working-directory: rust

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-output-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rust_output.json
            ${{ runner.temp }}/correction_hashes.txt
          retention-days: 14

  # After both matrix legs finish, diff their JSON outputs to catch any
  # platform-specific rendering differences (number formatting, encoding, etc.).
  compare:
    name: Platform parity (Linux vs Windows)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-output-ubuntu-latest
          path: linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-output-windows-latest
          path: windows

      - name: Diff Linux vs Windows JSON output
        run: |
          if diff linux/rust_output.json windows/rust_output.json; then
            echo "Linux and Windows JSON outputs are identical"
          else
            echo "Platform JSON mismatch detected — see diff above"
            exit 1
          fi

      - name: Diff Linux vs Windows correction hashes
        run: |
          if diff linux/correction_hashes.txt windows/correction_hashes.txt; then
            echo "Linux and Windows correction hashes are identical"
          else
            echo "Platform correction hash mismatch detected — see diff above"
            exit 1
          fi
