name: Python

on:
  workflow_dispatch:
  push:
    branches: ["main", "release"]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dependencies
        run: pip install -e "python/[dev]"

      - name: Check capability catalog codegen is up to date
        run: |
          pip install pyyaml jinja2
          python tools/generate_capabilities.py --check

      - name: Verify golden file checksum
        shell: bash
        run: |
          ACTUAL=$(sha256sum fixtures/reference_output.json | cut -d' ' -f1)
          EXPECTED=$(tr -d '[:space:]' < fixtures/reference_output.sha256)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: reference_output.json checksum mismatch."
            echo "  actual:   $ACTUAL"
            echo "  expected: $EXPECTED"
            echo "Regenerate with tools/generate_fixtures.py, review manually, then commit both."
            exit 1
          fi
          echo "Golden file checksum OK: $ACTUAL"

      - name: Run test suite
        run: python -m pytest python/tests/ -v --tb=short

      - name: Validate reference fixture (CLI)
        run: machine-config validate fixtures/reference_config.h5

      - name: Export reference fixture to JSON (CLI)
        run: machine-config export-json fixtures/reference_config.h5 --output "${{ runner.temp }}/reference_output_ci.json"

      - name: Full workflow example (smoke test)
        run: python examples/full_workflow/python/main.py

      - name: Confirm exported JSON matches golden file
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys
          golden = json.loads(pathlib.Path("fixtures/reference_output.json").read_text())
          ci_out = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("reference_output_ci.json").read_text())
          if golden != ci_out:
              print("FAIL: CLI export does not match committed golden file.")
              sys.exit(1)
          print("CLI export matches golden file.")
          EOF

      - name: Upload exported JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: reference_output_py${{ matrix.python-version }}_${{ matrix.os }}
          path: ${{ runner.temp }}/reference_output_ci.json
          retention-days: 14

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build
        working-directory: python
