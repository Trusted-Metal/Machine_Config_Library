name: Cross-Language Check

# Runs after any change that could affect correctness across language
# implementations: Python source, Rust source, Node.js source, shared
# fixtures, schema, or the cross-check script itself.
#
# Languages active now: python, rust, nodejs, cpp (all platforms) + go (all platforms via MSYS2)
# Go participates in Phases 1, 2, 4. Phases 3/3.5 deferred until Go writer (§5.7) is done.

on:
  workflow_dispatch:
  push:
    branches: ["main", "release"]
  pull_request:

jobs:
  cross_check:
    name: Cross-Language Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package and cross-check dependencies
        # machine_config ships jsonschema as a regular dep; deepdiff is extra
        run: pip install -e "python/[dev]" deepdiff

      # -----------------------------------------------------------------------
      # Rust
      # -----------------------------------------------------------------------
      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install HDF5 via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install hdf5:x64-windows

      - name: Set HDF5_DIR and add DLLs to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "HDF5_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust release binary
        run: cargo build --release
        working-directory: rust

      # -----------------------------------------------------------------------
      # Node.js  (h5wasm bundles libhdf5 as WASM — no system deps)
      # -----------------------------------------------------------------------
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - name: Install Node.js dependencies and build
        run: npm ci
        working-directory: nodejs

      - name: Build Node.js TypeScript
        run: npm run build
        working-directory: nodejs

      # -----------------------------------------------------------------------
      # Go  (CGo + libhdf5 — Linux via apt, Windows via MSYS2 MinGW64)
      # libhdf5-dev is already installed for Rust on Linux.
      # -----------------------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum

      # MSYS2 MINGW64 provides MinGW-compatible HDF5 + pkg-config for CGo on Windows.
      - name: Install MSYS2 MinGW64 HDF5 (Windows, Go CGo)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-hdf5
            mingw-w64-x86_64-pkg-config

      # Adds the actual MSYS2 mingw64/bin to Windows PATH for subsequent steps (HDF5 DLLs).
      - name: Add MSYS2 MinGW64 bin to PATH (Windows, Go runtime DLLs)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "$(cygpath -w /mingw64/bin)" >> "$GITHUB_PATH"

      - name: Build Go CLI binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          CGO_ENABLED=1 go build -o bin/machine-config-cli ./cmd/machine-config-cli/
        working-directory: go

      # go.exe is a native Windows binary; it can't resolve gcc from the POSIX-format PATH
      # set by the MSYS2 shell.  cygpath -w converts the POSIX path to a Windows path that
      # go.exe can exec directly, regardless of where setup-msys2 installed MSYS2.
      - name: Build Go CLI binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p go/bin
          export CGO_ENABLED=1
          export CC=$(cygpath -w /mingw64/bin/gcc.exe)
          export CXX=$(cygpath -w /mingw64/bin/g++.exe)
          cd go
          go build -o bin/machine-config-cli.exe ./cmd/machine-config-cli/

      # -----------------------------------------------------------------------
      # C++
      # Ubuntu: HDF5 1.14.6 built from source (cached); Windows: vcpkg archives.
      # Only the CLI binary is needed here — Catch2 tests are run in cpp.yml.
      # -----------------------------------------------------------------------
      - name: Cache HDF5 1.14.6 install (Ubuntu, C++)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        id: hdf5-cache-cpp
        with:
          path: ${{ github.workspace }}/hdf5-install
          key: hdf5-1.14.6-no-zlib-${{ matrix.os }}

      - name: Set HDF5_INSTALL env var (Ubuntu, C++)
        if: runner.os == 'Linux'
        run: echo "HDF5_INSTALL=${{ github.workspace }}/hdf5-install" >> $GITHUB_ENV

      - name: Build and install HDF5 1.14.6 (Ubuntu, C++)
        if: runner.os == 'Linux' && steps.hdf5-cache-cpp.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch hdf5_1.14.6 \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/hdf5-install \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_TOOLS=OFF \
            -DHDF5_BUILD_TESTS=OFF \
            -DHDF5_BUILD_HL_LIB=OFF \
            -DHDF5_ENABLE_Z_LIB_SUPPORT=OFF
          cmake --build hdf5-build -j$(nproc)
          cmake --install hdf5-build

      - name: Cache vcpkg binary archives (Windows, C++)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-x64-windows-${{ hashFiles('C:/vcpkg/vcpkg.exe') }}
          restore-keys: vcpkg-archives-x64-windows-

      - name: Install HDF5 via vcpkg (Windows, C++)
        if: runner.os == 'Windows'
        run: vcpkg install hdf5:x64-windows
        shell: pwsh

      - name: Verify HDF5 vcpkg config present (Windows, C++)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cfg = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\share\hdf5\hdf5-config.cmake"
          if (-not (Test-Path $cfg)) { Write-Error "HDF5 cmake config not found: $cfg"; exit 1 }

      - name: Add HDF5 DLLs to PATH (Windows, C++)
        if: runner.os == 'Windows'
        run: |
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" |
            Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
        shell: pwsh

      - name: Cache CMake FetchContent dependencies (C++)
        uses: actions/cache@v4
        with:
          path: cpp/build/_deps
          key: cmake-deps-v3-${{ matrix.os }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/tests/CMakeLists.txt') }}

      - name: Configure CMake (Ubuntu, C++)
        if: runner.os == 'Linux'
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$HDF5_INSTALL \
            -DHDF5_ROOT=$HDF5_INSTALL \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure CMake (Windows, C++)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', 'cpp',
            '-B', 'cpp/build',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          )
          cmake @cmakeArgs

      - name: Build C++ CLI binary
        run: cmake --build cpp/build --config Release --target machine_config_cli

      # -----------------------------------------------------------------------
      # Cross-check
      # -----------------------------------------------------------------------
      - name: Phase 1 — Schema validation (all languages)
        run: python tools/cross_check.py --langs python,rust,nodejs,cpp --skip-read-parity --skip-write-interop --skip-binary-copy --skip-correction-hash --verbose

      - name: Phase 1 — Schema validation (Go)
        run: python tools/cross_check.py --langs go --skip-read-parity --skip-write-interop --skip-binary-copy --skip-correction-hash --verbose

      - name: Phase 2 — Read parity (all fixtures, all languages)
        run: python tools/cross_check.py --langs python,rust,nodejs,cpp --skip-schema --skip-write-interop --skip-binary-copy --skip-correction-hash --verbose

      - name: Phase 2 — Read parity (Go vs Python)
        run: python tools/cross_check.py --langs python,go --skip-schema --skip-write-interop --skip-binary-copy --skip-correction-hash --verbose

      - name: Phase 3 — Write interoperability (all languages)
        run: python tools/cross_check.py --langs python,rust,nodejs,cpp --skip-schema --skip-read-parity --skip-binary-copy --skip-correction-hash --verbose

      - name: Phase 3.5 — Binary copy round-trip (all languages)
        run: python tools/cross_check.py --langs python,rust,nodejs,cpp --skip-schema --skip-read-parity --skip-write-interop --skip-correction-hash --verbose

      - name: Phase 4 — Correction data hash parity (all languages)
        run: python tools/cross_check.py --langs python,rust,nodejs,cpp --skip-schema --skip-read-parity --skip-write-interop --skip-binary-copy --verbose

      - name: Phase 4 — Correction data hash parity (Go vs Python)
        run: python tools/cross_check.py --langs python,go --skip-schema --skip-read-parity --skip-write-interop --skip-binary-copy --verbose

      # Upload both outputs so developers can diff them manually if a check fails.
      - name: Export Python JSON artifact
        if: always()
        shell: bash
        run: machine-config export-json fixtures/reference_config.h5 > "$RUNNER_TEMP/python_output.json"

      - name: Export Rust JSON artifact
        if: always()
        shell: bash
        run: |
          bin="rust/target/release/machine-config-cli"
          [[ "$RUNNER_OS" == "Windows" ]] && bin="${bin}.exe"
          "${bin}" export-json fixtures/reference_config.h5 > "$RUNNER_TEMP/rust_output_xcheck.json"

      - name: Export Node.js JSON artifact
        if: always()
        shell: bash
        run: |
          node nodejs/dist/cli.js export-json fixtures/reference_config.h5 \
            > "$RUNNER_TEMP/nodejs_output_xcheck.json"

      - name: Export C++ JSON artifact
        if: always()
        shell: bash
        run: |
          bin="cpp/build/machine_config_cli"
          [[ "$RUNNER_OS" == "Windows" ]] && bin="cpp/build/Release/machine_config_cli.exe"
          "$bin" export-json fixtures/reference_config.h5 > "$RUNNER_TEMP/cpp_output_xcheck.json"

      - name: Export Go JSON artifact
        if: always()
        shell: bash
        run: |
          bin="go/bin/machine-config-cli"
          [[ "$RUNNER_OS" == "Windows" ]] && bin="go/bin/machine-config-cli.exe"
          "$bin" export-json fixtures/reference_config.h5 > "$RUNNER_TEMP/go_output_xcheck.json"

      - name: Upload language outputs for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-check-outputs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/python_output.json
            ${{ runner.temp }}/rust_output_xcheck.json
            ${{ runner.temp }}/nodejs_output_xcheck.json
            ${{ runner.temp }}/cpp_output_xcheck.json
            ${{ runner.temp }}/go_output_xcheck.json
          retention-days: 14
