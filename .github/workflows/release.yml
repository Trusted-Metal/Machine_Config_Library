name: Release

on:
  push:
    branches:
      - main
      - release

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # semantic-release needs full git history
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install release tooling
        run: npm ci

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js library dependencies
        run: npm ci
        working-directory: nodejs

      - name: Install Python build frontend
        run: pip install build

      # -----------------------------------------------------------------------
      # C++ packaging prerequisite (VALIDATION_PLAN.md §10; see
      # docs/validation/cpp/tarball/results.md for the full design). Mirrors
      # cpp.yml's Ubuntu leg exactly: apt ships HDF5 1.10.10, HighFive >= 2.10
      # requires >= 1.12, so it's built from source and cached. The actual
      # `cmake` configure/install/package sequence runs inside
      # scripts/package-cpp.sh, called from publishCmd below — deliberately
      # AFTER sync-version.mjs (prepareCmd) has already bumped the version,
      # not here, so the packaged version.hpp carries the real release
      # version rather than whatever was configured before the bump.
      # -----------------------------------------------------------------------
      - name: Cache HDF5 1.14.6 install
        uses: actions/cache@v4
        id: hdf5-cache
        with:
          path: ${{ github.workspace }}/hdf5-install
          key: hdf5-1.14.6-no-zlib-v2-ubuntu-latest

      - name: Set HDF5_INSTALL env var
        run: echo "HDF5_INSTALL=${{ github.workspace }}/hdf5-install" >> $GITHUB_ENV

      # Ninja + the extra HDF5_BUILD_*/BUILD_TESTING=OFF flags below (added
      # after the from-source build was observed taking ~50min on a cold
      # cache) skip compiling HDF5's C++/Fortran/Java wrappers and its own
      # test suite — none of which this project ever links against — and use
      # a faster build system than the default Unix Makefiles.
      - name: Build and install HDF5 1.14.6
        if: steps.hdf5-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          git clone --depth 1 --branch hdf5_1.14.6 \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/hdf5-install \
            -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_TOOLS=OFF \
            -DHDF5_BUILD_TESTS=OFF \
            -DHDF5_BUILD_HL_LIB=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_JAVA=OFF \
            -DHDF5_ENABLE_Z_LIB_SUPPORT=OFF
          cmake --build hdf5-build -j$(nproc)
          cmake --install hdf5-build

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: cpp/build/_deps
          key: cmake-deps-v3-ubuntu-latest-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/tests/CMakeLists.txt') }}

      - name: Configure deploy key for git push
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: bash .github/scripts/configure-deploy-key-git.sh

      - name: Run semantic-release
        run: npx semantic-release --repository-url "${SEMANTIC_RELEASE_REPOSITORY_URL}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
