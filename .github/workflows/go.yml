name: Go

# Builds and tests the Go library on Ubuntu (CGo + libhdf5).
# Windows CI deferred (§5.14) — MSVC HDF5 does not link cleanly with MinGW CGo.

on:
  workflow_dispatch:
  push:
    branches: ["main", "release"]
    paths:
      - "go/**"
      - "fixtures/**"
      - "schema/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - "fixtures/**"
      - "schema/**"
      - ".github/workflows/go.yml"

jobs:
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum

      - name: Install libhdf5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhdf5-dev pkg-config

      - name: Proto gate (CGo dense attrs)
        run: |
          CGO_ENABLED=1 go run ./proto/proto_cgo_read_root_attrs/

      - name: Test
        run: CGO_ENABLED=1 go test ./... -count=1
