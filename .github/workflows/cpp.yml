name: C++

# Builds and tests the C++ library on Ubuntu and Windows, then verifies that
# both platforms produce bit-identical JSON output from the reference fixture.

on:
  workflow_dispatch:
  push:
    branches: ["main", "release"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # HDF5
      # Ubuntu apt ships 1.10.10 on all current runner images; HighFive 2.10
      # requires >= 1.12.  Build 1.14.6 from source and cache the install
      # tree — the 8-10 min compile only runs on a cache miss.
      # Windows: vcpkg provides a compatible pre-built HDF5.
      # -----------------------------------------------------------------------
      - name: Cache HDF5 1.14.6 install (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        id: hdf5-cache
        with:
          path: ${{ github.workspace }}/hdf5-install
          # bump suffix if build flags change
          key: hdf5-1.14.6-no-zlib-v2-${{ matrix.os }}

      - name: Set HDF5_INSTALL env var (Ubuntu)
        if: runner.os == 'Linux'
        run: echo "HDF5_INSTALL=${{ github.workspace }}/hdf5-install" >> $GITHUB_ENV

      # Ninja + the extra HDF5_BUILD_*/BUILD_TESTING=OFF flags below (added
      # after the from-source build was observed taking ~50min on a cold
      # cache) skip compiling HDF5's C++/Fortran/Java wrappers and its own
      # test suite — none of which this project ever links against — and use
      # a faster build system than the default Unix Makefiles.
      - name: Build and install HDF5 1.14.6 (Ubuntu)
        if: runner.os == 'Linux' && steps.hdf5-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          git clone --depth 1 --branch hdf5_1.14.6 \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/hdf5-install \
            -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_TOOLS=OFF \
            -DHDF5_BUILD_TESTS=OFF \
            -DHDF5_BUILD_HL_LIB=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_JAVA=OFF \
            -DHDF5_ENABLE_Z_LIB_SUPPORT=OFF
          cmake --build hdf5-build -j$(nproc)
          cmake --install hdf5-build

      - name: Cache vcpkg binary archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          # vcpkg serves HDF5 from this archive cache (~30s) instead of recompiling (~6.5min).
          # restore-keys allows a partial hit when the runner image updates (new vcpkg version)
          # so the old archives are still tried before falling back to a full build.
          key: vcpkg-archives-x64-windows-${{ hashFiles('C:/vcpkg/vcpkg.exe') }}
          restore-keys: vcpkg-archives-x64-windows-

      - name: Install HDF5 via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install hdf5:x64-windows
        shell: pwsh

      - name: Verify HDF5 vcpkg config present (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cfg = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\share\hdf5\hdf5-config.cmake"
          if (-not (Test-Path $cfg)) { Write-Error "HDF5 cmake config not found: $cfg"; exit 1 }

      - name: Add HDF5 DLLs to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" |
            Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
        shell: pwsh

      # -----------------------------------------------------------------------
      # CMake — configure, build, test
      # -----------------------------------------------------------------------

      # Cache the FetchContent download/build tree to avoid re-fetching
      # HighFive, nlohmann_json, CLI11, Catch2, and picosha2 on every run.
      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: cpp/build/_deps
          key: cmake-deps-v3-${{ matrix.os }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/tests/CMakeLists.txt') }}

      - name: Show CMake version
        run: cmake --version

      - name: Configure CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$HDF5_INSTALL \
            -DHDF5_ROOT=$HDF5_INSTALL \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Confirm HDF5 version found by CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          hdf5_dir=$(grep "^HDF5_DIR:" cpp/build/CMakeCache.txt | cut -d= -f2)
          echo "HDF5_DIR=$hdf5_dir"
          if [[ "$hdf5_dir" != "$HDF5_INSTALL"* ]]; then
            echo "::error::CMake resolved HDF5 from '$hdf5_dir' not from '$HDF5_INSTALL'"
            exit 1
          fi
          echo "HDF5 resolved from expected install."

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', 'cpp',
            '-B', 'cpp/build',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          )
          cmake @cmakeArgs

      - name: Build
        run: cmake --build cpp/build --config Release

      # 79 Catch2 tests across models, meta, machine, trains, scanner,
      # ClearBox, binary data, OpcuaConfig, JSON serialisation, the stable
      # capability facade, and the mock v1.1 adapter migration (AV-09-11).
      - name: Run Catch2 tests
        run: ctest --test-dir cpp/build -C Release --output-on-failure

      # -----------------------------------------------------------------------
      # C++ package (VALIDATION_PLAN.md §10) — "thin", find_package-based, not
      # a self-contained tarball (that design was abandoned; see
      # docs/validation/cpp/tarball/results.md for why). Installs
      # machine_config's own headers plus a generated MachineConfigConfig.cmake
      # that find_dependency()s HighFive/nlohmann_json (HDF5 comes transitively
      # through HighFive) — nothing is bundled. Reuses this job's already-
      # configured cpp/build, so HDF5 resolution (vcpkg on Windows, the
      # from-source install on Ubuntu) doesn't need a second implementation
      # here — the install step just packages what that same build already
      # resolved. This is a verification check only (fires on every push/PR,
      # produces nothing persisted) — a real distributable artifact is a
      # separate, not-yet-written piece; see the conversation this was
      # designed in for why that's deliberately deferred.
      # -----------------------------------------------------------------------
      - name: Install machine_config package
        run: cmake --install cpp/build --config Release --prefix ${{ github.workspace }}/cpp/pkg-install

      - name: Configure C++ package consumer (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S docs/validation/cpp/tarball/consumer -B docs/validation/cpp/tarball/consumer/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HDF5_INSTALL;${{ github.workspace }}/cpp/pkg-install"

      - name: Configure C++ package consumer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', 'docs/validation/cpp/tarball/consumer',
            '-B', 'docs/validation/cpp/tarball/consumer/build',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake",
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE\cpp\pkg-install"
          )
          cmake @cmakeArgs

      - name: Build C++ package consumer
        run: cmake --build docs/validation/cpp/tarball/consumer/build --config Release

      - name: Run C++ package consumer against reference fixture
        shell: bash
        run: |
          bin="docs/validation/cpp/tarball/consumer/build/consumer_app"
          [[ "$RUNNER_OS" == "Windows" ]] && bin="docs/validation/cpp/tarball/consumer/build/Release/consumer_app.exe"
          output=$("$bin" fixtures/reference_config.h5)
          echo "$output"
          if [[ "$output" != "[PASS]"* ]]; then
            echo "::error::C++ package consumer check failed"
            exit 1
          fi

          # Prove the whole version pipeline actually resolved to what it
          # should have, the same way "Confirm HDF5 version found by CMake"
          # (above) does for HDF5 — don't just build it, verify it resolved
          # to what was expected. Catches a stale cached install silently
          # reporting an old version as if nothing needed to change.
          # sed, not grep -P: PCRE support is locale-dependent and not
          # guaranteed portable across grep builds — verified directly, this
          # exact -P invocation failed on this machine's Git Bash grep even
          # with LC_ALL=C forced. sed with a basic-regex capture group has
          # no such dependency.
          expected=$(sed -n 's/.*MACHINE_CONFIG_FULL_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' cpp/cmake/Version.cmake)
          if [[ "$output" != *"package_version=\"$expected\""* ]]; then
            echo "::error::C++ package consumer reported a different version than cpp/cmake/Version.cmake declares (expected '$expected'): $output"
            exit 1
          fi
          echo "Package version resolved correctly: $expected"

      - name: Full workflow example (smoke test)
        shell: bash
        run: |
          bin="cpp/build/full_workflow"
          [[ "$RUNNER_OS" == "Windows" ]] && bin="cpp/build/Release/full_workflow.exe"
          "${bin}"

      - name: Quickstart example (smoke test)
        shell: bash
        run: |
          bin="cpp/build/quickstart"
          [[ "$RUNNER_OS" == "Windows" ]] && bin="cpp/build/Release/quickstart.exe"
          "${bin}"

      # -----------------------------------------------------------------------
      # Smoke test + artifact
      # -----------------------------------------------------------------------
      - name: Export reference fixture to JSON
        shell: bash
        run: |
          bin="cpp/build/machine_config_cli"
          [[ "$RUNNER_OS" == "Windows" ]] && bin="cpp/build/Release/machine_config_cli.exe"
          "$bin" export-json fixtures/reference_config.h5 > "$RUNNER_TEMP/cpp_output.json"
          echo "Exported $(wc -c < "$RUNNER_TEMP/cpp_output.json") bytes"

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-output-${{ matrix.os }}
          path: ${{ runner.temp }}/cpp_output.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Verify that Linux and Windows produce bit-identical JSON output so that
  # any platform-specific number formatting or encoding bugs are caught early.
  # ---------------------------------------------------------------------------
  compare:
    name: Platform parity (Linux vs Windows)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-output-ubuntu-24.04
          path: linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-output-windows-latest
          path: windows

      - name: Diff Linux vs Windows JSON output
        run: |
          if diff linux/cpp_output.json windows/cpp_output.json; then
            echo "Platform outputs are identical."
          else
            echo "Platform outputs differ — see diff above."
            exit 1
          fi
