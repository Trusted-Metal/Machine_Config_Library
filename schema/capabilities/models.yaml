# Stable facade models — field names are frozen for File_Version-agnostic apps.
# Each node may carry `extra` for additional attributes.
# Aligns with canonical JSON / nodejs/src/models.ts.
#
# Scope note: only flat scalar fields are listed per node — there's no
# array/nested-object type here. Compound/collection fields on the real
# StableModel (SynchronousSensor and its EquationConstant/CalibrationPoint
# rows; v1.1's PowerCharacterization, which nests the same two) are
# intentionally left out for the same reason SynchronousSensor already was —
# not yet representable in this file's shape.

models:
  Meta:
    extra: true
    fields:
      - { id: schema_version, type: string, nullable: false }
      - { id: machine_name, type: string, nullable: false }
      - { id: manufacturer, type: string, nullable: false }
      - { id: model, type: string, nullable: false }
      - { id: serial_number, type: string, nullable: false }
      - { id: file_version, type: string, nullable: false }
      - { id: export_date, type: string, nullable: false }
      - { id: configuration_hash, type: string, nullable: false }

  Machine:
    extra: true
    fields:
      - { id: id, type: string, nullable: true }
      - { id: machine_name, type: string, nullable: false }
      - { id: manufacturer, type: string, nullable: false }
      - { id: model, type: string, nullable: false }
      - { id: serial_number, type: string, nullable: false }
      - { id: build_plate_x, type: number, nullable: true }
      - { id: build_plate_x_unit, type: string, nullable: true }
      - { id: build_plate_y, type: number, nullable: true }
      - { id: build_plate_y_unit, type: string, nullable: true }
      - { id: build_plate_z, type: number, nullable: true }
      - { id: build_plate_z_unit, type: string, nullable: true }
      - { id: build_plate_radius, type: number, nullable: true }
      - { id: build_plate_radius_unit, type: string, nullable: true }
      - { id: gas_flow_direction, type: string, nullable: true }
      - { id: recoat_direction, type: string, nullable: true }

  AxisConfig:
    extra: true
    fields:
      - { id: actual_bit_resolution, type: number, nullable: true }
      - { id: actual_bit_resolution_unit, type: string, nullable: true }
      - { id: commanded_bit_resolution, type: number, nullable: true }
      - { id: commanded_bit_resolution_unit, type: string, nullable: true }
      - { id: control_type, type: string, nullable: true }
      - { id: range_of_motion, type: number, nullable: true }
      - { id: range_of_motion_unit, type: string, nullable: true }
      - { id: smoothing_kernel, type: string, nullable: true }
      - { id: smoothing_parameters, type: number, nullable: true }
      - { id: tuning_parameters, type: string, nullable: true }
      - { id: tuning_type, type: string, nullable: true }

  Scanner:
    extra: true
    fields:
      - { id: manufacturer, type: string, nullable: false }
      - { id: model, type: string, nullable: false }
      - { id: serial_number, type: string, nullable: false }
      - { id: working_distance, type: number, nullable: true }
      - { id: working_distance_unit, type: string, nullable: true }
      - { id: scan_field_x, type: number, nullable: true }
      - { id: scan_field_x_unit, type: string, nullable: true }
      - { id: scan_field_y, type: number, nullable: true }
      - { id: scan_field_y_unit, type: string, nullable: true }
      - { id: scan_field_z, type: number, nullable: true }
      - { id: scan_field_z_unit, type: string, nullable: true }
      - { id: scan_head_offset_x, type: number, nullable: true }
      - { id: scan_head_offset_x_unit, type: string, nullable: true }
      - { id: scan_head_offset_y, type: number, nullable: true }
      - { id: scan_head_offset_y_unit, type: string, nullable: true }
      - { id: scan_head_offset_z, type: number, nullable: true }
      - { id: scan_head_offset_z_unit, type: string, nullable: true }
      - { id: scan_head_rotation, type: number, nullable: true }
      - { id: scan_head_rotation_unit, type: string, nullable: true }
      - { id: axis_configuration, type: string, nullable: true }
      - { id: x_axis, type: AxisConfig, nullable: true }
      - { id: y_axis, type: AxisConfig, nullable: true }
      - { id: z_axis, type: AxisConfig, nullable: true }
