[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-config-library"
version = "0.1.1-rc.1"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "h5py>=3.0",
    "jsonschema>=4.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "Jinja2>=3.0",
    "deepdiff>=6.0",
]

[project.scripts]
machine-config = "machine_config.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
