[package]
name = "opcua-config-ext"
version = "1.2.0"
edition = "2021"

[dependencies]
machine-config = { path = "../rust" }
hdf5           = { package = "hdf5-metno", version = "0.12" }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
indexmap       = { version = "2", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
